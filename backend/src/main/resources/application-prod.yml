server:
  port: ${SERVER_PORT}

spring:
  sql:
    init:
      mode: never  # 프로덕션에서는 data.sql 실행 안함

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: meeting-scheduler-

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.MariaDB106Dialect
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 validate만
    properties:
      hibernate:
        format_sql: false  # 프로덕션에서는 포맷 끔
    database: mysql
    show-sql: false  # 프로덕션에서는 SQL 로그 끔

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: [ profile_nickname, profile_image ]
            redirect-uri: ${KAKAO_REDIRECT_URI}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    root: warn
    com.nathing.banthing: info
    org.hibernate.SQL: warn
  file:
    name: /var/log/banthing/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

cookie:
  domain: .banthing.shop
  secure: true  # HTTPS 필수
  http-only: true
  same-site: None  # CORS 대응
  access-token-name: ACCESS_TOKEN
  refresh-token-name: REFRESH_TOKEN
  access-max-age: ${COOKIE_ACCESS_TOKEN_MAX_AGE}
  refresh-max-age: ${COOKIE_REFRESH_TOKEN_MAX_AGE}

app:
  oauth2-success-redirect-url: https://banthing.shop/popup-close
  oauth2-failure-redirect-url: https://banthing.shop/popup-close?from=oauth2

google:
  ai:
    api-key: ${GOOGLE_AI_API_KEY}
    model: ${GOOGLE_AI_MODEL:gemini-1.5-flash}
    temperature: ${GOOGLE_AI_TEMPERATURE:0.7}
    max-tokens: ${GOOGLE_AI_MAX_TOKENS:1000}

file:
  upload-dir: ${FILE_UPLOAD_PATH}
  upload-url: /media/